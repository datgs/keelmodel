[project]
name = "keelmodel"
version = "0.1.0"
description = "A strict, sync-first data SDK for business applications"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "packaging>=24.0,<27.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".harness-core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.build-backend]
module-name = ["keelmodel", "keelpolicy"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
